<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulsar - Nova Mentoria</title>

  <link rel="stylesheet" href="../../css/mentor-layout.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/mentor/registrarMentoriaMentor.css" />

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<div class="shell">

  <!-- ── Sidebar do Mentor ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Expandir menu">
        <i data-lucide="panel-left" style="width:20px;height:20px;stroke-width:1.75"></i>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      <a class="sidebar-item" href="dashboardMentor.html" title="Dashboard">
        <span class="sidebar-item-icon"><i data-lucide="home"></i></span>
        <span class="sidebar-item-label">Dashboard</span>
      </a>
      <a class="sidebar-item" href="mentoradosMentor.html" title="Mentorados">
        <span class="sidebar-item-icon"><i data-lucide="users"></i></span>
        <span class="sidebar-item-label">Mentorados</span>
      </a>
      <a class="sidebar-item is-active" href="registrarMentoriaMentor.html" aria-current="page" title="Minhas Mentorias">
        <span class="sidebar-item-icon"><i data-lucide="calendar"></i></span>
        <span class="sidebar-item-label">Minhas Mentorias</span>
        <span class="sidebar-item-bar" aria-hidden="true"></span>
      </a>
      <a class="sidebar-item" href="impactoMentor.html" title="Impacto">
        <span class="sidebar-item-icon"><i data-lucide="bar-chart-3"></i></span>
        <span class="sidebar-item-label">Impacto</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="sidebar-item" href="configuracoesMentor.html" title="Configurações">
        <span class="sidebar-item-icon"><i data-lucide="settings"></i></span>
        <span class="sidebar-item-label">Configurações</span>
      </a>
    </div>
  </aside>

  <!-- ── Área principal ── -->
  <div class="shell-main">

    <header class="topbar">
      <a class="topbar-logo" href="dashboardMentor.html">
        <img src="../../../../assets/logoPulsar.png" alt="Pulsar">
      </a>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <div class="avatar-menu" id="avatarMenu">
          <button class="avatar-trigger" id="avatarTrigger" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar">
              <i data-lucide="user" style="width:18px;height:18px;stroke-width:2"></i>
            </span>
            <span class="avatar-meta">
              <span class="avatar-name"></span>
              <span class="avatar-role"></span>
            </span>
            <i data-lucide="chevron-down" class="avatar-chevron" style="width:16px;height:16px"></i>
          </button>

          <div class="avatar-dropdown" role="menu" hidden>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item is-danger" role="menuitem" id="btnLogout">
              <i data-lucide="log-out" style="width:16px;height:16px"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>

        <!-- Banner Ambiente Acadêmico (RNF-ORG-03) -->
    <div class="env-banner" role="status" aria-label="Aviso de ambiente acadêmico">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      Ambiente acadêmico — dados fictícios para fins educacionais.
    </div>
<main class="shell-content">
      <div class="shell-container">

        <div class="crumbs">
          <a class="crumb-link" href="registrarMentoriaMentor.html">Minhas Mentorias</a>
          <span class="sep">/</span>
          <span class="current">Nova Mentoria</span>
        </div>

        <div class="page-hero" style="display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-6)">
          <button class="btn btn-secondary" id="backBtn" style="gap:var(--space-2)">
            <i data-lucide="arrow-left" style="width:16px;height:16px"></i>
            Voltar
          </button>
          <h1 class="page-title" style="margin:0">Registrar Nova Mentoria</h1>
        </div>

        <form class="mentoring-form-card consultation-form" id="mentoringForm">

          <span class="form-label">Mentorados</span>
          <div class="mentee-selector" id="menteeSelector" role="button" tabindex="0">
            <i data-lucide="users" style="width:20px;height:20px;flex-shrink:0"></i>
            <div class="selected-mentees" id="selectedMentees">
              <span class="muted" id="menteeplaceholder">Selecionar mentorados…</span>
            </div>
            <i data-lucide="chevron-down" class="mentee-chevron" style="width:16px;height:16px;flex-shrink:0"></i>
          </div>
          <div class="jovens-dropdown" id="jovensDropdown" hidden>
            <div class="jovens-search">
              <i data-lucide="search" style="width:16px;height:16px;flex-shrink:0"></i>
              <input type="text" id="jovensSearch" placeholder="Buscar mentorado pelo nome…"
                autocomplete="off" />
            </div>
            <div class="jovens-list" id="jovensList">
              <p class="muted" style="padding:var(--space-3)">Carregando jovens…</p>
            </div>
          </div>

          <div class="form-grid">
            <label class="form-field">
              <span>Status</span>
              <select id="sessionStatus" name="sessionStatus" required>
                <option value="Agendada">Agendada</option>
                <option value="Realizada" selected>Realizada</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </label>

            <label class="form-field">
              <span>Data da Sessão</span>
              <div class="input-with-icon">
                <i data-lucide="calendar-days" style="width:20px;height:20px"></i>
                <input id="sessionDate" name="sessionDate" type="date" required />
              </div>
            </label>

            <label class="form-field">
              <span>Duração (min)</span>
              <div class="input-with-icon">
                <i data-lucide="clock" style="width:20px;height:20px"></i>
                <input id="sessionDuration" name="sessionDuration" type="number" min="15" step="15" value="60" required />
              </div>
            </label>
          </div>

          <fieldset class="topics-fieldset">
            <legend>Temas abordados</legend>
            <div class="topic-list" id="topicList">
              <button type="button" class="topic-chip" data-topic="Carreira">Carreira</button>
              <button type="button" class="topic-chip" data-topic="Programação">Programação</button>
              <button type="button" class="topic-chip" data-topic="Soft Skills">Soft Skills</button>
              <button type="button" class="topic-chip" data-topic="Empregabilidade">Empregabilidade</button>
              <button type="button" class="topic-chip" data-topic="Projeto">Projeto</button>
            </div>
            <div class="topic-add">
              <input type="text" id="newTopicInput" class="topic-add__input"
                placeholder="Adicionar outro tema…" autocomplete="off" maxlength="40" />
              <button type="button" class="btn btn-secondary topic-add__btn" id="addTopicBtn">
                <i data-lucide="plus" style="width:16px;height:16px"></i>
                Adicionar tema
              </button>
            </div>
          </fieldset>

          <label class="form-field observations-field">
            <span>Observações</span>
            <textarea id="sessionNotes" name="sessionNotes" placeholder="Descreva o que foi abordado na sessão…"></textarea>
          </label>

          <div id="formFeedback" hidden></div>

          <div class="form-actions">
            <button class="btn btn-secondary" type="button" id="cancelMentoringBtn">Cancelar</button>
            <button class="btn btn-success" type="submit" id="submitBtn">
              <i data-lucide="check" style="width:18px;height:18px"></i>
              Confirmar
            </button>
          </div>

        </form>

      </div>
    </main>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/dateLimits.js"></script>
<script src="../../js/mentor/mainMentor.js"></script>
<script src="../../js/mentor/mentor.js"></script>
<script src="../../js/mentor/novaMetoriaMentor.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
