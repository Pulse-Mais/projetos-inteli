<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulsar - Minhas Mentorias</title>

  <link rel="stylesheet" href="../../css/mentor-layout.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/mentor/registrarMentoriaMentor.css" />

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<div class="shell">

  <!-- ── Sidebar do Mentor ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Expandir menu">
        <i data-lucide="panel-left" style="width:20px;height:20px;stroke-width:1.75"></i>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      <a class="sidebar-item" href="dashboardMentor.html" title="Dashboard">
        <span class="sidebar-item-icon"><i data-lucide="home"></i></span>
        <span class="sidebar-item-label">Dashboard</span>
      </a>
      <a class="sidebar-item" href="mentoradosMentor.html" title="Mentorados">
        <span class="sidebar-item-icon"><i data-lucide="users"></i></span>
        <span class="sidebar-item-label">Mentorados</span>
      </a>
      <a class="sidebar-item is-active" href="registrarMentoriaMentor.html" aria-current="page" title="Minhas Mentorias">
        <span class="sidebar-item-icon"><i data-lucide="calendar"></i></span>
        <span class="sidebar-item-label">Minhas Mentorias</span>
        <span class="sidebar-item-bar" aria-hidden="true"></span>
      </a>
      <a class="sidebar-item" href="impactoMentor.html" title="Impacto">
        <span class="sidebar-item-icon"><i data-lucide="bar-chart-3"></i></span>
        <span class="sidebar-item-label">Impacto</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="sidebar-item" href="configuracoesMentor.html" title="Configurações">
        <span class="sidebar-item-icon"><i data-lucide="settings"></i></span>
        <span class="sidebar-item-label">Configurações</span>
      </a>
    </div>
  </aside>

  <!-- ── Área principal ── -->
  <div class="shell-main">

    <header class="topbar">
      <a class="topbar-logo" href="dashboardMentor.html">
        <img src="../../../../assets/logoPulsar.png" alt="Pulsar">
      </a>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <div class="avatar-menu" id="avatarMenu">
          <button class="avatar-trigger" id="avatarTrigger" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar">
              <i data-lucide="user" style="width:18px;height:18px;stroke-width:2"></i>
            </span>
            <span class="avatar-meta">
              <span class="avatar-name"></span>
              <span class="avatar-role"></span>
            </span>
            <i data-lucide="chevron-down" class="avatar-chevron" style="width:16px;height:16px"></i>
          </button>

          <div class="avatar-dropdown" role="menu" hidden>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item is-danger" role="menuitem" id="btnLogout">
              <i data-lucide="log-out" style="width:16px;height:16px"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>

        <!-- Banner Ambiente Acadêmico (RNF-ORG-03) -->
    <div class="env-banner" role="status" aria-label="Aviso de ambiente acadêmico">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      Ambiente acadêmico — dados fictícios para fins educacionais.
    </div>
<main class="shell-content">
      <div class="shell-container">

        <div class="crumbs">
          <span class="sep">/</span>
          <span class="current">Minhas Mentorias</span>
        </div>

        <div class="page-hero" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)">
          <h1 class="page-title">Minhas Mentorias</h1>
          <a class="btn btn-primary" href="novaMetoriaMentor.html">
            <i data-lucide="plus" style="width:17px;height:17px"></i>
            Nova mentoria
          </a>
        </div>

        <!-- ── Filtros ── -->
        <div class="mentorias-filters" id="mentoriasFilters">
          <div class="filter-tabs" role="tablist">
            <button class="filter-tab active" data-status="">Todas</button>
            <button class="filter-tab" data-status="Agendada">Agendadas</button>
            <button class="filter-tab" data-status="Realizada">Realizadas</button>
            <button class="filter-tab" data-status="Cancelada">Canceladas</button>
          </div>
          <div class="filter-controls">
            <div class="filter-search">
              <i data-lucide="search" style="width:15px;height:15px"></i>
              <input type="text" id="filterAluno" placeholder="Buscar aluno…" />
            </div>
            <div class="filter-dates">
              <input type="date" id="filterFrom" title="Data inicial" data-date-limit="past" />
              <span class="filter-dates-sep">–</span>
              <input type="date" id="filterTo" title="Data final" data-date-limit="past" />
            </div>
          </div>
        </div>

        <!-- ── Contagem e lista ── -->
        <div id="mentoriasFeedback" hidden></div>
        <p class="mentorias-count" id="mentoriasCount"></p>
        <div id="mentoriasList">
          <p class="muted">Carregando mentorias…</p>
        </div>

        <!-- ── Paginação ── -->
        <div class="mentorias-pagination" id="mentoriasPagination" hidden></div>

      </div>
    </main>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/dateLimits.js"></script>
<script src="../../js/mentor/mainMentor.js"></script>
<script src="../../js/mentor/mentor.js"></script>
<script src="../../js/mentor/registrarMentoriaMentor.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
