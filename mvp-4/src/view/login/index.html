<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Pulse Mais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/coordenadora/css/tokens.css">
  <link rel="stylesheet" href="/coordenadora/css/base.css">
  <link rel="stylesheet" href="/login/login.css">
</head>
<body>
  <main class="login-pagina">
    <section class="login-marca" aria-label="Pulse Mais">
      <div class="login-decoracao login-decoracao--pontos" aria-hidden="true"></div>
      <div class="login-decoracao login-decoracao--circulo" aria-hidden="true"></div>
      <div class="login-decoracao login-decoracao--escudo" aria-hidden="true"></div>
      <div class="login-decoracao login-decoracao--trilha" aria-hidden="true"></div>
      <div class="login-marca__conteudo">
        <img class="login-logo" src="/assets/imagemPulseSemFundo.png" alt="Pulse Mais">
        <div class="login-marca__mensagem">
          <h1>Dados que acompanham cada jornada.</h1>
          <p>Acesse indicadores, registros e informações dos alunos em um único lugar.</p>
          <span class="login-marca__linha" aria-hidden="true"></span>
          <div class="login-marca__assinatura"><span class="login-marca__icone"><i data-lucide="users-round"></i></span><span>Plataforma de gestão de impacto social</span></div>
        </div>
      </div>
    </section>
    <section class="login-form-area">
      <div class="login-card">
        <header class="login-card__cabecalho"><h2>Boas-vindas</h2><p>Entre com as credenciais associadas ao seu perfil.</p></header>
        <form id="form-login" novalidate>
          <label class="login-campo"><span>E-mail, RA ou RM</span><span class="login-controle"><i data-lucide="mail" aria-hidden="true"></i><input name="identificador" autocomplete="username" required placeholder="Digite seu e-mail, RA ou RM"></span></label>
          <label class="login-campo"><span>Senha</span><span class="login-controle"><i data-lucide="lock-keyhole" aria-hidden="true"></i><input type="password" name="senha" autocomplete="current-password" required placeholder="Digite sua senha"><button class="login-senha-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false"><i data-lucide="eye-off" aria-hidden="true"></i></button></span></label>
          <label class="login-campo"><span>Perfil de acesso</span><span class="login-controle login-controle--select"><i data-lucide="user-round" aria-hidden="true"></i><select name="perfil" required><option value="coordenadora">Coordenadora pedagógica</option><option value="gestor">Gestor</option><option value="psicologa">Psicóloga</option><option value="aluno">Aluno</option></select><i class="login-select-seta" data-lucide="chevron-down" aria-hidden="true"></i></span></label>
          <button class="login-entrar" type="submit"><span>Entrar</span><i data-lucide="arrow-right" aria-hidden="true"></i></button>
          <p id="erro-login" class="login-erro" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/login/login.js"></script>
</body>
</html>
