<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor | Turmas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../globalStyle/tokens.css">
  <link rel="stylesheet" href="../styles/turmas.css">
</head>
<body>
  <!-- Layout principal da pagina Turmas do Gestor -->
  <div class="layout-gestor app-shell">
    <!-- Sidebar: Logo, CardPerfil, Menu -->
    <aside class="sidebar" aria-label="Menu do gestor">
      <a class="brand" href="./dashboard.html" aria-label="Pulse Mais">
        <img class="brand-logo" src="../../assets/imagemPulse.png" alt="Pulse Mais">
      </a>

      <section class="manager-card" aria-label="Usu&aacute;rio logado">
        <span class="manager-avatar">
          <i data-lucide="circle-user" aria-hidden="true"></i>
        </span>
        <p>Ol&aacute;, Gestor<br>Rafael</p>
      </section>

      <nav class="sidebar-nav" aria-label="Navega&ccedil;&atilde;o principal">
        <a class="nav-item" href="./dashboard.html">
          <i data-lucide="chart-bar" aria-hidden="true"></i>
          Dashboard
        </a>
        <a class="nav-item active" href="./turmas.html" aria-current="page">
          <i data-lucide="users" aria-hidden="true"></i>
          Turmas
        </a>
        <a class="nav-item" href="./comunicados.html">
          <i data-lucide="message-square-dot" aria-hidden="true"></i>
          Comunicados
        </a>        <button type="button" id="logoutButton" class="nav-item nav-item-logout" aria-label="Sair da conta">
          <i data-lucide="log-out" aria-hidden="true"></i>
          Sair
        </button>      </nav>
    </aside>

    <main class="pagina-turmas">
      <!-- Cabecalho da pagina Turmas -->
      <header class="pagina-cabecalho">
        <h1>Turmas</h1>
        <p class="pagina-subtitulo">Acompanhe o progresso das 4 turmas ativas &middot; 87 alunos no total</p>
      </header>

      <!-- Busca, filtro de status e ordenacao -->
      <section class="filtros">
        <div class="busca">
          <i data-lucide="search"></i>
          <input type="text" class="busca-input" placeholder="Buscar turma...">
        </div>
        <select class="filtro-select" data-filtro="status">
          <option value="">Status: todas</option>
          <option value="ativas">Ativas</option>
          <option value="inativas">Inativas</option>
        </select>
        <select class="filtro-select" data-filtro="ordem">
          <option value="az">Ordenar: A-Z</option>
          <option value="za">Ordenar: Z-A</option>
          <option value="mais-alunos">Mais alunos</option>
        </select>
      </section>

      <!-- Linhas de turma: cada uma leva aos alunos passando a turma na URL -->
      <section class="lista-turmas" aria-label="Turmas do gestor" aria-live="polite">
        <div class="gestor-estado gestor-estado--carregando">Carregando turmas...</div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/gestor-api.js"></script>
  <script src="../js/gestor.js"></script>
  <script src="../js/turmas.js"></script>
</body>
</html>
