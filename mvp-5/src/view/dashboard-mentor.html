<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Pulse Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pulse.css" />
  <script src="lucide.min.js"></script>
  <style>
    .hero-card {
      background: var(--brand-dark);
      border-radius: 16px;
      padding: 32px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }
    .hero-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--white);
      flex-shrink: 0;
    }
    .hero-info { flex: 1; }
    .hero-name {
      color: var(--white);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .hero-badges { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .hero-meta { display: flex; flex-direction: column; gap: 8px; }
    .hero-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.82);
      font-size: 13px;
    }
    .hero-meta-row svg { flex-shrink: 0; opacity: 0.7; }

    .stats-section { }
    .stats-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 16px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .stat-value {
      font-size: 30px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label { font-size: 13px; color: var(--navy); margin-bottom: 2px; }
    .stat-sub   { font-size: 11px; color: var(--muted); }

    .sessions-card { }
    .sessions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .sessions-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
    }
    .sessions-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--blue-btn);
      text-decoration: none;
    }
    .sessions-link:hover { text-decoration: underline; }

    .session-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 12px;
      margin: 0 -12px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      border-radius: 8px;
      transition: background .15s;
    }
    .session-item:hover { background: rgba(0, 56, 112, 0.04); }
    .session-item:last-child { border-bottom: none; }
    .session-jovem-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--brand-dark);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .session-info { flex: 1; min-width: 0; }
    .session-jovem-name { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
    .session-desc { font-size: 12px; color: var(--slate); margin-bottom: 2px; }
    .session-meta { font-size: 11px; color: var(--muted); }
    .session-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 899px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-card  { flex-direction: column; gap: 16px; }
    }
    @media (max-width: 599px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .session-actions { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar__logo"><span class="sidebar__logo-text">PC</span></div>
    <nav class="sidebar__nav" aria-label="Navegação principal">
      <a href="dashboard-mentor.html" class="sidebar__nav-item active" title="Dashboard" aria-current="page">
        <i data-lucide="layout-dashboard" width="20" height="20"></i>
        <span class="sidebar__nav-label">Dashboard</span>
      </a>
      <a href="perfil-mentor.html" class="sidebar__nav-item" title="Perfil">
        <i data-lucide="user-circle" width="20" height="20"></i>
        <span class="sidebar__nav-label">Perfil</span>
      </a>
    </nav>
    <div class="sidebar__bottom">
      <a href="configuracoes.html" class="sidebar__avatar-mini" id="sidebar-avatar-mini" title="Configurações de perfil">
        <span id="sidebar-initials">--</span>
      </a>
      <button class="sidebar__nav-item" title="Sair" onclick="logout()"
              style="background:none;border:none;cursor:pointer;width:100%;">
        <i data-lucide="log-out" width="20" height="20" style="color:rgba(255,255,255,0.6);"></i>
        <span class="sidebar__nav-label">Sair</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__breadcrumb">

        <span>Dashboard</span>
      </div>
      <div class="topbar__actions">
        <a class="topbar__user" href="configuracoes.html" title="Configurações de perfil" style="text-decoration:none;">
          <div class="topbar__user-avatar" id="topbar-avatar">--</div>
          <span class="topbar__user-name" id="topbar-name">Usuário</span>
        </a>
      </div>
    </header>

    <main class="content">

      <!-- Hero card -->
      <div class="hero-card">
        <div class="hero-avatar" id="hero-avatar">DS</div>
        <div class="hero-info">
          <div class="hero-name" id="hero-name">Daniel Souza</div>
          <div class="hero-badges">
            <span class="badge badge--green-soft">MENTOR</span>
            <span class="badge badge--yellow" id="hero-badge-area" style="display:none;"></span>
          </div>
          <div class="hero-meta">
            <div class="hero-meta-row">
              <i data-lucide="mail" width="14" height="14"></i>
              <span id="hero-email">—</span>
            </div>
            <div class="hero-meta-row">
              <i data-lucide="briefcase" width="14" height="14"></i>
              <span id="hero-area">—</span>
            </div>
            <div class="hero-meta-row">
              <i data-lucide="map-pin" width="14" height="14"></i>
              <span id="hero-cidade">—</span>
            </div>
            <div class="hero-meta-row">
              <i data-lucide="clock" width="14" height="14"></i>
              <span id="hero-disponibilidade">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-section">
        <div class="stats-label">Taxas</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background:var(--green-badge-bg);">
              <i data-lucide="users" width="18" height="18" style="color:var(--green-badge-text);"></i>
            </div>
            <div class="stat-value" id="stat-mentorandos">—</div>
            <div class="stat-label">Mentorandos ativos</div>
            <div class="stat-sub">Programa 2025</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:var(--blue-light);">
              <i data-lucide="trending-up" width="18" height="18" style="color:var(--blue-btn);"></i>
            </div>
            <div class="stat-value" id="stat-sessoes">—</div>
            <div class="stat-label">Sessões realizadas</div>
            <div class="stat-sub">Total acumulado</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:var(--error-bg);">
              <i data-lucide="star" width="18" height="18" style="color:var(--error-text);"></i>
            </div>
            <div class="stat-value" id="stat-avaliacao">—</div>
            <div class="stat-label">Avaliação média</div>
            <div class="stat-sub">Feedback dos alunos</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:var(--orange-light);">
              <i data-lucide="clock" width="18" height="18" style="color:var(--orange-text);"></i>
            </div>
            <div class="stat-value" id="stat-horas">—</div>
            <div class="stat-label">Horas de mentoria</div>
            <div class="stat-sub">Total contribuído</div>
          </div>
        </div>
      </div>

      <!-- Sessões Recentes -->
      <div class="card sessions-card">
        <div class="sessions-header">
          <div class="sessions-title">
            <i data-lucide="clock" width="16" height="16" style="color:var(--brand-dark);"></i>
            Sessões Recentes
          </div>
          <a href="#" class="sessions-link">Ver histórico completo →</a>
        </div>
        <div id="sessions-list">
          <div class="skeleton" style="height:72px;border-radius:8px;margin-bottom:12px;"></div>
          <div class="skeleton" style="height:72px;border-radius:8px;margin-bottom:12px;"></div>
          <div class="skeleton" style="height:72px;border-radius:8px;"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="toast-container"></div>

<script>
const API = 'http://localhost:3000/api';

async function apiFetch(path, options = {}) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 150000);
  try {
    const res = await fetch(API + path, {
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', ...options.headers },
      ...options,
    });
    clearTimeout(timer);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw { status: res.status, message: body.error || `HTTP ${res.status}` };
    }
    if (res.status === 204) return null;
    return res.json();
  } catch (err) {
    clearTimeout(timer);
    if (err instanceof TypeError || err.name === 'AbortError') {
      console.warn('[DEV] API offline — usando dados mock.');
      return null;
    }
    throw err;
  }
}

function getSession() {
  try {
    const raw = sessionStorage.getItem('pulse_session') || localStorage.getItem('pulse_session');
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function initials(nome = '') {
  return nome.trim().split(/\s+/).filter(Boolean).map(p => p[0].toUpperCase()).join('');
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDateTime(s) {
  if (!s) return '—';
  try {
    const d = new Date(s.length === 10 ? s + 'T12:00:00' : s);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }) +
           ', ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch (_) { return s; }
}

function toast(msg, type = 'default') {
  const el = document.createElement('div');
  const bg = { success: '#166534', error: '#991b1b', default: 'var(--navy)' };
  el.className = 'toast';
  el.style.background = bg[type] || bg.default;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function logout() {
  sessionStorage.removeItem('pulse_session');
  localStorage.removeItem('pulse_session');
  window.location.href = 'dashboard.html';
}

// ── Avatar colors for jovens ───────────────────────────────────
const AVATAR_COLORS = ['#003870','#0E7490','#2563EB','#7C3AED','#0F766E'];

function renderSessions(sessions, jovens) {
  const container = document.getElementById('sessions-list');

  if (!sessions || !sessions.length) {
    container.innerHTML = '<p class="empty-state">Nenhuma sessão registrada.</p>';
    lucide.createIcons();
    return;
  }

  const jovemMap = {};
  if (Array.isArray(jovens)) jovens.forEach(j => { jovemMap[j.id] = j; });

  const today = new Date();
  const sorted = [...sessions].sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 5);

  container.innerHTML = sorted.map((s, i) => {
    const jovem = jovemMap[s.id_jovem] || {};
    const jovemNome = jovem.nome || `Jovem #${s.id_jovem}`;
    const ini = initials(jovemNome);
    const cor = AVATAR_COLORS[i % AVATAR_COLORS.length];

    const sessaoNum = s.numero_sessao || s.id || (i + 1);
    const desc = s.observacao || s.descricao || s.tema || 'Sessão de mentoria';
    const duracao = s.duracao ? `${s.duracao}` : '1h';

    const dataStr = s.data || s.data_sessao;
    const isFutura = dataStr && new Date(dataStr) > today;
    const isRealizada = s.presente === true || s.presente === 1;

    let badgeHtml, statusText;
    if (isRealizada) {
      badgeHtml = '<span class="badge badge--green">CONCLUÍDA</span>';
      statusText = `Duração: ${duracao} · ${fmtDateTime(dataStr)}`;
    } else if (isFutura) {
      badgeHtml = '<span class="badge badge--yellow">AGENDADA</span>';
      statusText = `Agendada · ${fmtDateTime(dataStr)}`;
    } else {
      badgeHtml = '<span class="badge badge--blue">PENDENTE</span>';
      statusText = fmtDateTime(dataStr);
    }

    return `
      <a class="session-item" href="dados-mentorando.html?jovem=${encodeURIComponent(s.id_jovem || '')}">
        <div class="session-jovem-avatar" style="background:${cor};">${escHtml(ini)}</div>
        <div class="session-info">
          <div class="session-jovem-name">${escHtml(jovemNome)}</div>
          <div class="session-desc">Sessão #${sessaoNum} · ${escHtml(desc)}</div>
          <div class="session-meta">${escHtml(statusText)}</div>
        </div>
        <div class="session-actions">
          ${badgeHtml}
        </div>
      </a>`;
  }).join('');

  lucide.createIcons();
}

function computeStats(sessions) {
  if (!sessions || !sessions.length) {
    ['stat-mentorandos','stat-sessoes','stat-avaliacao','stat-horas'].forEach(id => {
      document.getElementById(id).textContent = '0';
    });
    document.getElementById('stat-avaliacao').textContent = '–';
    return;
  }

  const mentorandos = new Set(sessions.map(s => s.id_jovem)).size;
  const total = sessions.length;

  const avaliacoes = sessions.filter(s => s.avaliacao != null && !isNaN(Number(s.avaliacao)));
  const avgAval = avaliacoes.length
    ? (avaliacoes.reduce((acc, s) => acc + Number(s.avaliacao), 0) / avaliacoes.length).toFixed(1)
    : '–';

  const totalHoras = sessions.reduce((acc, s) => {
    const h = parseFloat(s.duracao) || parseFloat(s.horas) || 1;
    return acc + h;
  }, 0);

  document.getElementById('stat-mentorandos').textContent = mentorandos;
  document.getElementById('stat-sessoes').textContent     = total;
  document.getElementById('stat-avaliacao').textContent   = avgAval;
  document.getElementById('stat-horas').textContent       = Math.round(totalHoras) + 'h';
}

async function renderDashboard(session) {
  const userId = session.id || session.userId;

  const [usuario, sessions, jovens] = await Promise.all([
    apiFetch('/usuarios/' + userId),
    apiFetch('/mentor/' + userId + '/mentorias'),
    apiFetch('/jovens'),
  ]);

  // Hero card
  if (usuario) {
    const ini = initials(usuario.nome || session.nome);
    document.getElementById('hero-avatar').textContent = ini;
    document.getElementById('hero-name').textContent   = usuario.nome || session.nome;
    document.getElementById('hero-email').textContent  = usuario.email || '—';
    const area = [usuario.area_atuacao, usuario.area, usuario.cargo].filter(Boolean).join(' · ') || '—';
    document.getElementById('hero-area').textContent   = area;
    const badgeArea = usuario.area_atuacao || usuario.area;
    const badgeAreaEl = document.getElementById('hero-badge-area');
    if (badgeAreaEl && badgeArea) {
      badgeAreaEl.textContent = String(badgeArea).toUpperCase();
      badgeAreaEl.style.display = '';
    }
    document.getElementById('hero-cidade').textContent = usuario.cidade || '—';
    const disp = usuario.disponibilidade || usuario.horario || '—';
    document.getElementById('hero-disponibilidade').textContent =
      (usuario.membro_desde ? `Membro Pulse desde ${usuario.membro_desde} · ` : '') + disp;
  }

  const sessionsList = Array.isArray(sessions) ? sessions : [];
  computeStats(sessionsList);
  renderSessions(sessionsList, Array.isArray(jovens) ? jovens : []);
}

(async () => {
  const session = getSession();
  if (!session || session.perfil !== 'Mentor') {
    window.location.href = 'dashboard.html';
    return;
  }

  const ini = initials(session.nome || '');
  document.getElementById('topbar-name').textContent      = session.nome || 'Mentor';
  document.getElementById('topbar-avatar').textContent    = ini;
  document.getElementById('sidebar-initials').textContent = ini;
  document.getElementById('hero-avatar').textContent      = ini;
  document.getElementById('hero-name').textContent        = session.nome || 'Mentor';

  lucide.createIcons();

  await renderDashboard(session);
  lucide.createIcons();
})();
</script>
</body>
</html>
