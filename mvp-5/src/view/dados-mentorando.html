<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dados do Mentorando — Pulse Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pulse.css" />
  <script src="lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .search-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
    }
    .search-input-wrap {
      flex: 1;
      position: relative;
    }
    .search-input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .search-input-wrap input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px 0 38px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      color: var(--navy);
      background: var(--white);
      outline: none;
      transition: border-color .15s;
    }
    .search-input-wrap input:focus { border-color: var(--blue-btn); }
    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      z-index: 50;
      max-height: 220px;
      overflow-y: auto;
    }
    .search-dropdown-item {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--navy);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .search-dropdown-item:last-child { border-bottom: none; }
    .search-dropdown-item:hover { background: var(--bg); }
    .filter-select {
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      color: var(--navy);
      background: var(--white);
      outline: none;
      cursor: pointer;
      min-width: 130px;
    }

    .jovem-header { margin-bottom: 24px; }
    .jovem-name { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .jovem-sub  { font-size: 13px; color: var(--muted); }

    .donuts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .donut-item {
      text-align: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 12px;
    }
    .donut-ring { position: relative; width: 104px; height: 104px; margin: 0 auto; }
    .donut-ring canvas { width: 104px; height: 104px; display: block; }
    .donut-center {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: var(--navy);
    }
    .donut-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 12px; }
    @media (max-width: 560px) { .donuts-grid { grid-template-columns: 1fr; } }

    .pontos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    .pontos-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
    .ponto-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .ponto-item:last-child { margin-bottom: 0; }
    .ponto-forte { background: var(--green-badge-bg); color: var(--navy); }
    .ponto-forte svg { color: var(--green-badge-text); flex-shrink: 0; margin-top: 1px; }
    .ponto-atencao { background: var(--orange-light); }
    .ponto-atencao svg { color: var(--orange-text); flex-shrink: 0; margin-top: 1px; }
    .ponto-atencao-text strong { color: var(--navy); display: block; }
    .ponto-atencao-text span   { color: var(--orange-text); font-size: 11px; }

    .jornada-title  { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
    .jornada-list   { display: flex; flex-direction: column; gap: 0; }
    .jornada-item   { display: flex; align-items: flex-start; gap: 14px; padding-bottom: 20px; position: relative; }
    .jornada-item:last-child { padding-bottom: 0; }
    .jornada-line {
      position: absolute;
      left: 17px;
      top: 36px;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .jornada-item:last-child .jornada-line { display: none; }
    .jornada-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 1;
    }
    .jornada-dot--done    { background: var(--brand-green); }
    .jornada-dot--current { background: var(--brand-dark); }
    .jornada-dot--future  { background: var(--border); }
    .jornada-info { padding-top: 6px; }
    .jornada-etapa { font-size: 14px; font-weight: 600; color: var(--navy); }
    .jornada-data  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .empty-state svg { display: block; margin: 0 auto 12px; opacity: 0.4; }

    @media (max-width: 699px) {
      .pontos-grid { grid-template-columns: 1fr; }
      .donuts-grid { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar__logo"><span class="sidebar__logo-text">PC</span></div>
    <nav class="sidebar__nav" aria-label="Navegação principal">
      <a href="dashboard-mentor.html" class="sidebar__nav-item" title="Dashboard">
        <i data-lucide="layout-dashboard" width="20" height="20"></i>
        <span class="sidebar__nav-label">Dashboard</span>
      </a>
      <a href="perfil-mentor.html" class="sidebar__nav-item" title="Perfil">
        <i data-lucide="user-circle" width="20" height="20"></i>
        <span class="sidebar__nav-label">Perfil</span>
      </a>
    </nav>
    <div class="sidebar__bottom">
      <a href="configuracoes.html" class="sidebar__avatar-mini" id="sidebar-avatar-mini" title="Configurações de perfil">
        <span id="sidebar-initials">--</span>
      </a>
      <button class="sidebar__nav-item" title="Sair" onclick="logout()"
              style="background:none;border:none;cursor:pointer;width:100%;">
        <i data-lucide="log-out" width="20" height="20" style="color:rgba(255,255,255,0.6);"></i>
        <span class="sidebar__nav-label">Sair</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__breadcrumb">

        <a href="dashboard-mentor.html" style="color:var(--muted);text-decoration:none;">Dashboard</a>
        <i data-lucide="chevron-right" width="14" height="14"></i>
        <span>Dados do Mentorando</span>
      </div>
      <div class="topbar__actions">
        <a class="topbar__user" href="configuracoes.html" title="Configurações de perfil" style="text-decoration:none;">
          <div class="topbar__user-avatar" id="topbar-avatar">--</div>
          <span class="topbar__user-name" id="topbar-name">Usuário</span>
        </a>
      </div>
    </header>

    <main class="content">

      <!-- Busca e filtros -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <i data-lucide="search" width="15" height="15"></i>
          <input id="search-input" type="search" placeholder="Buscar outro mentorando..." autocomplete="off" />
          <div class="search-dropdown hidden" id="search-dropdown"></div>
        </div>
        <select class="filter-select" id="filter-programa">
          <option value="">Programa</option>
        </select>
        <select class="filter-select" id="filter-categoria">
          <option value="">Categoria</option>
          <option value="Conectado">Conectado</option>
          <option value="Capacitado">Capacitado</option>
          <option value="Transformado">Transformado</option>
        </select>
      </div>

      <!-- Conteúdo do jovem selecionado -->
      <div id="jovem-content">
        <div class="empty-state">
          <i data-lucide="user-search" width="40" height="40"></i>
          <p>Selecione um mentorando para visualizar os dados.</p>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="toast-container"></div>

<script>
const API = 'http://localhost:3000/api';

async function apiFetch(path, options = {}) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 150000);
  try {
    const res = await fetch(API + path, {
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', ...options.headers },
      ...options,
    });
    clearTimeout(timer);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw { status: res.status, message: body.error || `HTTP ${res.status}` };
    }
    if (res.status === 204) return null;
    return res.json();
  } catch (err) {
    clearTimeout(timer);
    if (err instanceof TypeError || err.name === 'AbortError') {
      console.warn('[DEV] API offline.');
      return null;
    }
    throw err;
  }
}

function getSession() {
  try {
    const raw = sessionStorage.getItem('pulse_session') || localStorage.getItem('pulse_session');
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function initials(nome = '') {
  return nome.trim().split(/\s+/).filter(Boolean).map(p => p[0].toUpperCase()).join('');
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(s) {
  if (!s) return '—';
  try { return new Date(s.length === 10 ? s + 'T12:00:00' : s).toLocaleDateString('pt-BR'); }
  catch (_) { return s; }
}

function toast(msg, type = 'default') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = type === 'success' ? '#166534' : type === 'error' ? '#991b1b' : 'var(--navy)';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function logout() {
  sessionStorage.removeItem('pulse_session');
  localStorage.removeItem('pulse_session');
  window.location.href = 'dashboard.html';
}

// ── Donut chart helper ─────────────────────────────────────────
let donutCharts = [];
let _mentorandoId = null;
let _mentorandoNome = '';

function drawDonut(canvasId, pct, color) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const existing = Chart.getChart(ctx);
  if (existing) existing.destroy();

  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      datasets: [{
        data: [pct, 100 - pct],
        backgroundColor: [color, '#E2E8F0'],
        borderWidth: 0,
      }]
    },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      cutout: '72%',
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      animation: { duration: 600 },
    }
  });
  donutCharts.push(chart);
}

// ── Render jovem ───────────────────────────────────────────────
function renderJovem(perfil) {
  const container = document.getElementById('jovem-content');

  if (!perfil) {
    container.innerHTML = `
      <div class="empty-state">
        <i data-lucide="alert-circle" width="40" height="40"></i>
        <p>Sem dados disponíveis para este mentorando.</p>
      </div>`;
    lucide.createIcons();
    return;
  }

  // Tentar extrair campos do perfil completo (API pode variar)
  const jovem   = perfil.jovem   || perfil;
  const nome    = jovem.nome     || perfil.nome    || '—';
  _mentorandoId = jovem.id ?? perfil.id ?? null;
  _mentorandoNome = nome;
  const programa = jovem.programa || perfil.programa || jovem.nome_programa || '—';
  const modulo   = jovem.modulo   || perfil.modulo  || jovem.especializacao || '';

  const freqPct      = Number(perfil.frequencia      ?? perfil.taxa_frequencia   ?? 0);
  const conteudoPct  = Number(perfil.conteudo        ?? perfil.taxa_conteudo     ?? 0);
  const mentoriasPct = Number(perfil.mentorias       ?? perfil.taxa_mentorias    ?? 0);

  const pontosFortes  = Array.isArray(perfil.pontos_fortes)  ? perfil.pontos_fortes  : [];
  const pontosAtencao = Array.isArray(perfil.pontos_atencao) ? perfil.pontos_atencao :
                        Array.isArray(perfil.atencao)         ? perfil.atencao         : [];
  const jornada = Array.isArray(perfil.jornada) ? perfil.jornada :
                  Array.isArray(perfil.etapas)  ? perfil.etapas  : [];

  const subTitle = [programa, modulo].filter(Boolean).join(' · ');

  container.innerHTML = `
    <div class="card">
      <div class="jovem-header">
        <div class="jovem-name">${escHtml(nome)}</div>
        <div class="jovem-sub">${escHtml(subTitle)}</div>
      </div>

      <div class="donuts-grid">
        <div class="donut-item">
          <div class="donut-ring">
            <canvas id="donut-freq" width="104" height="104"></canvas>
            <div class="donut-center">${freqPct}%</div>
          </div>
          <div class="donut-label">Frequência</div>
        </div>
        <div class="donut-item">
          <div class="donut-ring">
            <canvas id="donut-cont" width="104" height="104"></canvas>
            <div class="donut-center">${conteudoPct}%</div>
          </div>
          <div class="donut-label">Conteúdo</div>
        </div>
        <div class="donut-item">
          <div class="donut-ring">
            <canvas id="donut-ment" width="104" height="104"></canvas>
            <div class="donut-center">${mentoriasPct}%</div>
          </div>
          <div class="donut-label">Mentorias</div>
        </div>
      </div>

      <div class="pontos-grid">
        <div>
          <div class="pontos-title">Pontos fortes</div>
          ${pontosFortes.length
            ? pontosFortes.map(p => `
              <div class="ponto-item ponto-forte">
                <i data-lucide="check-circle" width="16" height="16"></i>
                <span>${escHtml(typeof p === 'string' ? p : p.nome || p.descricao || '')}</span>
              </div>`).join('')
            : '<p style="color:var(--muted);font-size:13px;">Sem dados disponíveis.</p>'
          }
        </div>
        <div>
          <div class="pontos-title">Pontos de atenção</div>
          ${pontosAtencao.length
            ? pontosAtencao.map(p => {
                const label = typeof p === 'string' ? p : (p.nome || p.descricao || '');
                const sub   = typeof p === 'object' ? (p.nivel || p.status || '') : '';
                return `
                  <div class="ponto-item ponto-atencao">
                    <i data-lucide="alert-circle" width="16" height="16"></i>
                    <div class="ponto-atencao-text">
                      <strong>${escHtml(label)}</strong>
                      ${sub ? `<span>${escHtml(sub)}</span>` : ''}
                    </div>
                  </div>`;
              }).join('')
            : '<p style="color:var(--muted);font-size:13px;">Sem dados disponíveis.</p>'
          }
        </div>
      </div>

      <div>
        <div class="jornada-title">Jornada do mentorando</div>
        ${jornada.length
          ? `<div class="jornada-list">${jornada.map((e, i) => {
              const label = typeof e === 'string' ? e : (e.nome || e.etapa || e.categoria || `Etapa ${i+1}`);
              const data  = typeof e === 'object' ? (e.data || e.data_conclusao || '') : '';
              const status = typeof e === 'object' ? (e.status || '') : '';
              const isDone    = status === 'concluido' || status === 'completed' || (data && new Date(data) < new Date());
              const isCurrent = status === 'em_andamento' || status === 'current' || (!isDone && i === jornada.findIndex(x => !(x.status === 'concluido' || x.status === 'completed')));
              const dotClass  = isDone ? 'jornada-dot--done' : isCurrent ? 'jornada-dot--current' : 'jornada-dot--future';
              const icon      = isDone ? 'check' : isCurrent ? 'circle' : 'minus';
              const iconColor = isDone || isCurrent ? '#fff' : 'var(--muted)';
              return `
                <div class="jornada-item">
                  <div class="jornada-line"></div>
                  <div class="jornada-dot ${dotClass}">
                    <i data-lucide="${icon}" width="16" height="16" style="color:${iconColor};"></i>
                  </div>
                  <div class="jornada-info">
                    <div class="jornada-etapa">${escHtml(label)}</div>
                    <div class="jornada-data">${data ? fmtDate(data) : (isCurrent ? 'Em andamento' : 'A definir')}</div>
                  </div>
                </div>`;
            }).join('')}</div>`
          : '<p style="color:var(--muted);font-size:13px;">Sem dados disponíveis.</p>'
        }
      </div>

      <div style="margin-top:28px;">
        <button class="btn btn--outline w-full" onclick="abrirAnotacoes()"
                style="border-color:var(--brand-dark);color:var(--brand-dark);font-size:13px;padding:12px;">
          <i data-lucide="file-text" width="15" height="15"></i>
          VER ANOTAÇÕES
        </button>
      </div>
    </div>`;

  lucide.createIcons();

  // Desenhar donuts após o DOM ser atualizado
  requestAnimationFrame(() => {
    drawDonut('donut-freq', freqPct,      '#003870');
    drawDonut('donut-cont', conteudoPct,  '#FFD927');
    drawDonut('donut-ment', mentoriasPct, '#33B458');
  });
}

// ── Busca ──────────────────────────────────────────────────────
let allJovens = [];
let searchTimer;

function bindSearch() {
  const input    = document.getElementById('search-input');
  const dropdown = document.getElementById('search-dropdown');

  input.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = input.value.trim().toLowerCase();
    if (!q) { dropdown.classList.add('hidden'); return; }
    searchTimer = setTimeout(() => {
      const results = allJovens.filter(j => (j.nome || '').toLowerCase().includes(q)).slice(0, 8);
      if (!results.length) { dropdown.classList.add('hidden'); return; }
      dropdown.innerHTML = results.map(j =>
        `<div class="search-dropdown-item" data-id="${j.id}">${escHtml(j.nome)}</div>`
      ).join('');
      dropdown.classList.remove('hidden');

      dropdown.querySelectorAll('.search-dropdown-item').forEach(el => {
        el.addEventListener('click', () => {
          input.value = '';
          dropdown.classList.add('hidden');
          loadJovem(el.dataset.id);
          history.pushState({}, '', `?jovem=${el.dataset.id}`);
        });
      });
    }, 250);
  });

  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.add('hidden');
    }
  });
}

async function loadJovem(id) {
  document.getElementById('jovem-content').innerHTML =
    '<div class="skeleton" style="height:400px;border-radius:12px;"></div>';

  const perfil = await apiFetch('/jovens/' + id + '/perfil-completo');
  renderJovem(perfil);
}

async function loadProgramas() {
  const programas = await apiFetch('/programas');
  if (!Array.isArray(programas)) return;
  const sel = document.getElementById('filter-programa');
  programas.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.nome || p.name || `Programa ${p.id}`;
    sel.appendChild(opt);
  });
}

(async () => {
  const session = getSession();
  if (!session || session.perfil !== 'Mentor') {
    window.location.href = 'dashboard.html';
    return;
  }

  const ini = initials(session.nome || '');
  document.getElementById('topbar-name').textContent      = session.nome || 'Mentor';
  document.getElementById('topbar-avatar').textContent    = ini;
  document.getElementById('sidebar-initials').textContent = ini;

  lucide.createIcons();

  // Carregar lista de jovens para busca
  const jovensData = await apiFetch('/jovens');
  allJovens = Array.isArray(jovensData) ? jovensData : [];

  bindSearch();
  loadProgramas();

  // Verificar parâmetro na URL
  const jovemId = new URLSearchParams(location.search).get('jovem');
  if (jovemId) {
    await loadJovem(jovemId);
  }

  lucide.createIcons();
})();

// ── Anotações (registros de acompanhamento — tipo Mentoria) ────────
function abrirAnotacoes() {
  if (!_mentorandoId) { toast('Selecione um mentorando primeiro.', 'error'); return; }
  document.getElementById('anot-titulo').textContent = `Anotações — ${_mentorandoNome}`;
  document.getElementById('anot-texto').value = '';
  document.getElementById('anot-overlay').style.display = 'flex';
  carregarAnotacoes();
}

function fecharAnotacoes() {
  document.getElementById('anot-overlay').style.display = 'none';
}

async function carregarAnotacoes() {
  const lista = document.getElementById('anot-lista');
  lista.innerHTML = '<p style="color:var(--muted);font-size:13px;">Carregando...</p>';
  const session = getSession();
  const regs = await apiFetch(`/jovens/${_mentorandoId}/prontuario?id_usuario=${session.userId}`);
  if (!Array.isArray(regs) || !regs.length) {
    lista.innerHTML = '<p style="color:var(--muted);font-size:13px;">Nenhuma anotação registrada.</p>';
    return;
  }
  lista.innerHTML = regs.map(r => `
    <div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;">
        <span>${escHtml((r.tipo_registro || 'Registro').replace(/_/g, ' '))}</span>
        <span>${r.data_registro ? fmtDate(r.data_registro) : ''}</span>
      </div>
      <div style="font-size:13px;color:var(--navy);white-space:pre-wrap;">${escHtml(r.conteudo || '')}</div>
    </div>`).join('');
}

async function salvarAnotacao() {
  const texto = document.getElementById('anot-texto').value.trim();
  if (!texto) { toast('Escreva uma anotação.', 'error'); return; }
  const session = getSession();
  const btn = document.getElementById('anot-salvar');
  btn.disabled = true;
  const res = await apiFetch(`/jovens/${_mentorandoId}/prontuario`, {
    method: 'POST',
    body: JSON.stringify({
      id_autor: session.userId,
      tipo_registro: 'Mentoria',
      visibilidade: 'Publico_Equipe',
      conteudo: texto,
    }),
  });
  btn.disabled = false;
  if (res !== null && res !== undefined) {
    toast('Anotação salva!', 'success');
    document.getElementById('anot-texto').value = '';
    carregarAnotacoes();
  } else {
    toast('Não foi possível salvar a anotação.', 'error');
  }
}
</script>

<!-- ── Modal de anotações ─────────────────────────────────────────── -->
<div id="anot-overlay" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(10,22,40,0.45);align-items:center;justify-content:center;padding:16px;">
  <div style="background:var(--white);border-radius:16px;padding:28px;width:100%;max-width:520px;box-shadow:0 8px 40px rgba(0,0,0,0.18);max-height:85vh;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 id="anot-titulo" style="font-size:16px;font-weight:700;color:var(--navy);margin:0;">Anotações</h3>
      <button onclick="fecharAnotacoes()" title="Fechar"
              style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;">&times;</button>
    </div>
    <div id="anot-lista" style="overflow-y:auto;flex:1;margin-bottom:14px;min-height:80px;"></div>
    <textarea id="anot-texto" placeholder="Escreva uma nova anotação..." rows="3"
              style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;font-size:13px;color:var(--navy);outline:none;resize:vertical;margin-bottom:12px;"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="fecharAnotacoes()"
              style="padding:9px 18px;border:1px solid var(--border);border-radius:8px;background:transparent;font-family:inherit;font-size:13px;color:var(--navy);cursor:pointer;">Fechar</button>
      <button id="anot-salvar" onclick="salvarAnotacao()"
              style="padding:9px 18px;background:var(--brand-dark);border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;color:var(--white);cursor:pointer;">Salvar anotação</button>
    </div>
  </div>
</div>
</body>
</html>
