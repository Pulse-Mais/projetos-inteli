<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard de desempenho Pulse Mais — acompanhe suas soft skills e próximas atividades.">
  <title>Pulse Mais — Dashboard de Desempenho</title>
  <link rel="icon" type="image/png" href="/assets/logoAzul.png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboardAluno.css">
</head>
<body>

<a href="#main-content" class="skip-link">Ir para o conteúdo principal</a>

<div class="layout">

  <div class="sidebar-overlay" aria-hidden="true"></div>

  <!-- Sidebar de navegação -->
  <aside class="sidebar">
    <div class="sidebar__top">
      <a href="perfilAlunoPortal.html" class="sidebar__avatar-link" aria-label="Acessar Meu Perfil">
        <img src="/assets/avatar.png" class="sidebar__avatar" alt="Foto do aluno">
        <span class="sidebar__avatar-hint">Meu Perfil</span>
      </a>
      <nav class="sidebar__nav">
        <a href="homepageAluno.html" class="sidebar__link">Homepage</a>
        <a href="dashboardAluno.html" class="sidebar__link ativo" aria-current="page">Dashboard</a>
        <a href="agendaAluno.html" class="sidebar__link">Agenda</a>
      </nav>
    </div>

    <div class="sidebar__spacer"></div>

    <div class="sidebar__bottom">
      <div class="sidebar__logo">
        <img src="/assets/logoAzul.png" alt="Pulse Mais">
      </div>
      <div class="sidebar__logout">
        <button class="sidebar__link" id="btnLogout" aria-label="Sair da conta">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Sair
        </button>
      </div>
    </div>
  </aside>

  <!-- Conteúdo principal -->
  <main class="main-content page-grid" id="main-content">

    <div class="page-topbar">
      <button class="menu-toggle" aria-label="Abrir menu de navegação">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h2>Dashboard</h2>
    </div>

    <!-- Barra de busca -->
    <div class="dash-search">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" id="dashSearch" placeholder="Buscar atividades, eventos e mais..." aria-label="Buscar atividades">
    </div>

    <!-- Cards de resumo (KPIs) -->
    <div class="kpi-row">
      <div class="kpi-card card">
        <svg id="kpiFrequenciaIcon" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" class="kpi-card__icon kpi-card__icon--green"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        <span class="kpi-card__valor" id="kpiFrequencia">—</span>
        <span class="kpi-card__label">Frequência</span>
        <span class="kpi-card__sub" id="kpiFrequenciaSub"></span>
      </div>
      <div class="kpi-card card">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" class="kpi-card__icon"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="kpi-card__valor" id="kpiMentorias">—</span>
        <span class="kpi-card__label" id="kpiMentoriasLabel">Encontros</span>
        <span class="kpi-card__sub" id="kpiMentoriasSub">participados</span>
      </div>
      <div class="kpi-card card">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" class="kpi-card__icon"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span class="kpi-card__valor" id="kpiEventos">—</span>
        <span class="kpi-card__label">Eventos</span>
        <span class="kpi-card__sub">participados</span>
      </div>
    </div>

    <!-- Minhas Aulas por Curso (Pulse Mais) -->
    <div class="card proximas-card" id="minhasAulasCard" style="display:none">
      <h3>Minhas Aulas</h3>
      <div id="minhasAulasBars" class="programa-bars"></div>
    </div>

    <!-- Meus Mentores -->
    <div class="card mentores-card" id="mentoresCard" style="display:none">
      <h3>Meus Mentores</h3>
      <div id="mentoresList" class="mentores-list"></div>
    </div>

    <!-- Próximas atividades -->
    <div class="card proximas-card">
      <h3>Próximas atividades</h3>

      <div class="tabela-header">
        <span>ATIVIDADE</span>
        <span>DATA</span>
        <span>TIPO</span>
        <span>STATUS</span>
      </div>

      <!-- Linhas da tabela preenchidas via JS -->
      <div id="tabelaAtividades" class="tabela-atividades">
      </div>
    </div>

  </main>
</div>

<script src="../js/auth.js"></script>
<script src="../js/portalAluno.js"></script>
<script src="../js/dashboardAluno.js"></script>
</body>
</html>
