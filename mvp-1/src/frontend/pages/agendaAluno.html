<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minha Agenda — visualize suas mentorias agendadas na plataforma Pulse Mais.">
  <title>Pulse Mais — Minha Agenda</title>
  <link rel="icon" type="image/png" href="/assets/logoAzul.png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/agendaAluno.css">
</head>
<body>

<a href="#main-content" class="skip-link">Ir para o conteúdo principal</a>

<div class="layout">

  <div class="sidebar-overlay" aria-hidden="true"></div>

  <!-- Sidebar de navegação -->
  <aside class="sidebar">
    <div class="sidebar__top">
      <a href="perfilAlunoPortal.html" class="sidebar__avatar-link" aria-label="Acessar Meu Perfil">
        <img src="/assets/avatar.png" class="sidebar__avatar" alt="Foto do aluno">
        <span class="sidebar__avatar-hint">Meu Perfil</span>
      </a>
      <nav class="sidebar__nav">
        <a href="homepageAluno.html" class="sidebar__link">Homepage</a>
        <a href="dashboardAluno.html" class="sidebar__link">Dashboard</a>
        <a href="agendaAluno.html" class="sidebar__link ativo" aria-current="page">Agenda</a>
      </nav>
    </div>

    <div class="sidebar__spacer"></div>

    <div class="sidebar__bottom">
      <div class="sidebar__logo">
        <img src="/assets/logoAzul.png" alt="Pulse Mais">
      </div>
      <div class="sidebar__logout">
        <button class="sidebar__link" id="btnLogout" aria-label="Sair da conta">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Sair
        </button>
      </div>
    </div>
  </aside>

  <!-- Conteúdo principal -->
  <main class="main-content" id="main-content">

    <div class="page-topbar">
      <button class="menu-toggle" aria-label="Abrir menu de navegação">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h2>Minha Agenda</h2>
    </div>

    <div class="page-header">
      <h1>Minha Agenda</h1>
      <p>Visualize suas aulas, eventos e atividades agendadas.</p>
    </div>

    <!-- Card do calendário -->
    <div class="calendario-wrapper">

      <!-- Navegação de mês -->
      <div class="calendario-nav">
        <div class="calendario-nav__esquerda">
          <button class="calendario-nav__btn" id="btnMesAnterior" aria-label="Mês anterior">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <span class="calendario-nav__titulo" id="tituloMes">Carregando...</span>
          <button class="calendario-nav__btn" id="btnProximoMes" aria-label="Próximo mês">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Grade do calendário — preenchida pelo JS -->
      <div class="calendario-grid" id="calendarioGrid" aria-live="polite">
        <div class="calendario-dia-semana">Dom</div>
        <div class="calendario-dia-semana">Seg</div>
        <div class="calendario-dia-semana">Ter</div>
        <div class="calendario-dia-semana">Qua</div>
        <div class="calendario-dia-semana">Qui</div>
        <div class="calendario-dia-semana">Sex</div>
        <div class="calendario-dia-semana">Sab</div>
      </div>

      <!-- Legenda (preenchida dinamicamente pelo JS) -->
      <div class="calendario-legenda" id="legendaAgenda">
        <div class="legenda-cor"></div>
        <span class="legenda-texto">Carregando...</span>
      </div>

    </div>

  </main>

</div>

<script src="../js/auth.js"></script>
<script src="../js/portalAluno.js"></script>
<script src="../js/agendaAluno.js"></script>
</body>
</html>
