<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Mais — Agenda de Mentorias</title>
  <meta name="description" content="Agenda de mentorias do mentor — Plataforma Pulse Mais">
    <link rel="icon" type="image/png" href="../assets/logoAzul.png">
  <link rel="stylesheet" href="../css/global.css">
    <link rel="icon" type="image/png" href="../assets/logoAzul.png">
  <link rel="stylesheet" href="../css/agendaMentorias.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="sidebar__top">
      <a href="perfilMentor.html" class="sidebar__avatar-link" aria-label="Meu Perfil">
        <img src="../assets/avatar.png" class="sidebar__avatar" id="sidebarAvatar" alt="Meu Perfil">
        <span class="sidebar__avatar-hint">Meu Perfil</span>
      </a>

      <nav class="sidebar__nav">
        <a href="homepageMentor.html" class="sidebar__link">
          Homepage
        </a>
        <a href="alunosAssociados.html" class="sidebar__link">
          Alunos Associados
        </a>
        <a href="agendaMentorias.html" class="sidebar__link ativo">
          Agendas
        </a>
      </nav>
    </div>

    <div class="sidebar__spacer"></div>

    <div class="sidebar__bottom">
      <div class="sidebar__logo">
        <img src="/assets/logoAzul.png" alt="Pulse Mais">
      </div>
      <div class="sidebar__logout">
        <button class="sidebar__link" onclick="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Sair
        </button>
      </div>
    </div>

  </aside>

  <!-- Conteúdo principal -->
  <main class="main-content">

    <div class="page-topbar">
      <h2>Agenda de Mentorias</h2>
    </div>

    <div class="page-header">
      <p>Visualize e agende suas sessões de mentoria.</p>
    </div>

    <!-- Card do calendário -->
    <div class="calendario-wrapper">

      <!-- Navegação de mês -->
      <div class="calendario-nav">
        <div class="calendario-nav__esquerda">
          <button class="calendario-nav__btn" id="btnMesAnterior" aria-label="Mês anterior">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <span class="calendario-nav__titulo" id="tituloMes">Carregando...</span>
          <button class="calendario-nav__btn" id="btnProximoMes" aria-label="Próximo mês">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
        <button class="btn btn--primary" id="btnAgendar">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Agendar Mentoria
        </button>
      </div>

      <!-- Grade do calendário — preenchida pelo JS -->
      <div class="calendario-grid" id="calendarioGrid">
        <!-- Cabeçalho dos dias da semana -->
        <div class="calendario-dia-semana">Dom</div>
        <div class="calendario-dia-semana">Seg</div>
        <div class="calendario-dia-semana">Ter</div>
        <div class="calendario-dia-semana">Qua</div>
        <div class="calendario-dia-semana">Qui</div>
        <div class="calendario-dia-semana">Sex</div>
        <div class="calendario-dia-semana">Sab</div>
        <!-- Dias do mês inseridos pelo JS -->
      </div>

      <!-- Legenda -->
      <div class="calendario-legenda">
        <div class="legenda-cor"></div>
        <span class="legenda-texto">Mentoria agendada</span>
      </div>

    </div>

  </main>

</div>

<!-- Modal: Agendar mentoria -->
<div class="modal-azul" id="modalAgendar">
  <div class="modal-azul__content">

    <div class="modal-azul__header">
      <h3>Agendar Nova Mentoria</h3>
      <button class="modal-azul__fechar" id="btnFecharAgendar" aria-label="Fechar modal">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="modal-azul__body">
      <form id="formAgendar">

        <!-- Busca de aluno -->
        <span class="modal-section-label">Buscar Aluno</span>
        <div class="form-group" style="margin-bottom:8px;">
          <input
            type="text"
            id="campoBuscaAluno"
            placeholder="Digite o nome do aluno..."
            autocomplete="off"
          >
        </div>

        <!-- Pills de filtro de busca -->
        <div class="pills-grupo">
          <button type="button" class="pill ativo" data-tipo="nome">Nome</button>
          <button type="button" class="pill" data-tipo="email">E-mail</button>
        </div>

        <!-- Resultados da busca -->
        <div class="resultados-busca" id="resultadosBusca"></div>

        <!-- Info do aluno selecionado -->
        <div class="aluno-selecionado-info" id="alunoSelecionadoInfo"></div>

        <!-- Data e horário -->
        <div class="form-2col">
          <div class="form-group">
            <label for="campoData">Data</label>
            <input type="date" id="campoData" required>
          </div>
          <div class="form-group">
            <label for="campoHorario">Horário</label>
            <input type="time" id="campoHorario" required>
          </div>
        </div>

        <!-- Tema -->
        <div class="form-group">
          <label for="campoTema">Tema</label>
          <input
            type="text"
            id="campoTema"
            placeholder="Ex: Preparação para entrevistas, revisão de currículo..."
            required
          >
        </div>

        <!-- Observações -->
        <div class="form-group">
          <label for="campoObservacoes">Observações (opcional)</label>
          <textarea
            id="campoObservacoes"
            rows="3"
            placeholder="Informações adicionais sobre a sessão..."
          ></textarea>
        </div>

        <div class="modal-azul__actions">
          <button type="button" class="btn btn--outline" id="btnCancelarAgendar">Cancelar</button>
          <button type="submit" class="btn btn--accent" id="btnConfirmarAgendar">Agendar</button>
        </div>

      </form>
    </div>

  </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/datePicker.js"></script>
<script src="../js/agendaMentorias.js"></script>
</body>
</html>
